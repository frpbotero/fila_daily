<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Standup</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --text: #e6edf3;
      --muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { font-size: 1.1rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 0.5rem; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .status-dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    main { max-width: 900px; margin: 0 auto; padding: 1.5rem; display: grid; grid-template-columns: 1fr 320px; gap: 1.5rem; }
    @media (max-width: 720px) { main { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .card-header {
      padding: 0.875rem 1.25rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Current presenter */
    .presenter-card { grid-column: 1; }
    .presenter-body { padding: 2rem 1.5rem; text-align: center; }
    .presenter-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    .presenter-name { font-size: 2.4rem; font-weight: 700; color: var(--accent); margin-bottom: 1.5rem; }
    .presenter-name.done { color: var(--green); font-size: 1.6rem; }
    .presenter-name.empty { color: var(--muted); font-size: 1.2rem; }

    .progress-bar { background: var(--border); border-radius: 99px; height: 6px; margin-bottom: 0.4rem; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s; }
    .progress-text { font-size: 0.78rem; color: var(--muted); margin-bottom: 1.5rem; }

    .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    button {
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity .15s, transform .1s;
    }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover:not(:disabled) { opacity: 0.85; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-danger:hover:not(:disabled) { opacity: 0.85; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
    .btn-success { background: var(--green); color: #000; }
    .btn-success:hover:not(:disabled) { opacity: 0.85; }

    /* Queue */
    .queue-list { list-style: none; }
    .queue-item {
      display: flex;
      align-items: center;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border);
      gap: 0.75rem;
      font-size: 0.9rem;
    }
    .queue-item:last-child { border-bottom: none; }
    .queue-item.done { opacity: 0.4; text-decoration: line-through; }
    .queue-item.current { background: rgba(88,166,255,0.06); }
    .queue-badge {
      width: 22px; height: 22px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .badge-done { background: rgba(63,185,80,0.15); color: var(--green); }
    .badge-current { background: var(--accent); color: #000; }
    .badge-next { background: var(--border); color: var(--muted); }
    .badge-skipped { background: rgba(210,153,34,0.15); color: var(--yellow); }
    .queue-name { flex: 1; }
    .skip-tag { font-size: 0.7rem; color: var(--yellow); background: rgba(210,153,34,0.1); padding: 0.1rem 0.4rem; border-radius: 4px; }

    /* Participants panel */
    .add-form { display: flex; gap: 0.5rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
    .add-form input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      outline: none;
    }
    .add-form input:focus { border-color: var(--accent); }
    .add-form button { padding: 0.5rem 0.875rem; font-size: 0.875rem; }

    .participant-item {
      display: flex;
      align-items: center;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
      gap: 0.5rem;
    }
    .participant-item:last-child { border-bottom: none; }
    .participant-item span { flex: 1; }
    .del-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .del-btn:hover { color: var(--red); background: rgba(248,81,73,0.1); }

    /* Skips log */
    .skip-log { padding: 0.75rem 1.25rem; }
    .skip-entry { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; line-height: 1.4; }
    .skip-entry strong { color: var(--yellow); }

    /* Toast */
    #toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 999;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.25s;
      max-width: 300px;
    }
    #toast.show { transform: translateY(0); opacity: 1; }

    /* Skip modal */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .overlay.show { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.75rem;
      width: 90%;
      max-width: 400px;
    }
    .modal h3 { margin-bottom: 0.25rem; font-size: 1.1rem; }
    .modal p { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
    .modal textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.75rem;
      font-size: 0.875rem;
      resize: vertical;
      min-height: 80px;
      outline: none;
      font-family: inherit;
      margin-bottom: 1rem;
    }
    .modal textarea:focus { border-color: var(--yellow); }
    .modal .actions { justify-content: flex-end; }

    .empty-state { padding: 1.5rem; text-align: center; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <span>📋</span> Daily Standup
  </div>
  <div style="display:flex;align-items:center;gap:0.5rem;font-size:0.8rem;color:var(--muted)">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Inativa</span>
  </div>
</header>

<main>
  <!-- Left: current presenter + queue -->
  <div style="display:flex;flex-direction:column;gap:1.25rem;">

    <!-- Presenter card -->
    <div class="card presenter-card">
      <div class="card-header">🎙 Apresentando agora</div>
      <div class="presenter-body">
        <div class="presenter-label" id="presenterLabel">—</div>
        <div class="presenter-name empty" id="presenterName">Nenhuma daily ativa</div>

        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        <div class="progress-text" id="progressText">0 / 0 participantes</div>

        <div class="actions">
          <button class="btn-primary" id="btnStart" onclick="startDaily()">▶ Iniciar Daily</button>
          <button class="btn-success" id="btnNext" onclick="nextParticipant()" disabled>✅ Concluído</button>
          <button class="btn-danger" id="btnSkip" onclick="openSkipModal()" disabled>⏭ Pular</button>
          <button class="btn-ghost" onclick="resetDaily()">↺ Resetar</button>
        </div>
      </div>
    </div>

    <!-- Queue -->
    <div class="card">
      <div class="card-header">📋 Ordem da daily</div>
      <ul class="queue-list" id="queueList">
        <li class="empty-state">Nenhum participante na fila</li>
      </ul>
    </div>

    <!-- Skips log -->
    <div class="card" id="skipsCard" style="display:none">
      <div class="card-header">⏭ Pulados hoje</div>
      <div class="skip-log" id="skipLog"></div>
    </div>
  </div>

  <!-- Right: participants -->
  <div style="display:flex;flex-direction:column;gap:1.25rem;">
    <div class="card">
      <div class="card-header">👥 Participantes</div>
      <div class="add-form">
        <input type="text" id="newName" placeholder="Nome do participante…" onkeydown="if(event.key==='Enter')addParticipant()" />
        <button class="btn-primary" onclick="addParticipant()">+</button>
      </div>
      <div id="participantsList">
        <div class="empty-state">Nenhum participante cadastrado</div>
      </div>
    </div>
  </div>
</main>

<!-- Skip modal -->
<div class="overlay" id="skipOverlay">
  <div class="modal">
    <h3>⏭ Pular participante</h3>
    <p>Vez de: <strong id="skipCurrentName">—</strong></p>
    <textarea id="skipJustification" placeholder="Justificativa para o pulo…"></textarea>
    <div class="actions">
      <button class="btn-ghost" onclick="closeSkipModal()">Cancelar</button>
      <button class="btn-danger" onclick="confirmSkip()">Confirmar pulo</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  let currentState = null;

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    return res.json();
  }

  async function loadState() {
    try {
      currentState = await api('GET', '/api/state');
      renderState(currentState);
    } catch (e) {
      console.error(e);
    }
  }

  function renderState(s) {
    // Status dot
    document.getElementById('statusDot').className = 'status-dot' + (s.dailyActive ? ' active' : '');
    document.getElementById('statusText').textContent = s.dailyActive ? 'Daily ativa' : 'Inativa';

    // Presenter
    const nameEl = document.getElementById('presenterName');
    const labelEl = document.getElementById('presenterLabel');
    if (!s.dailyActive) {
      nameEl.textContent = 'Nenhuma daily ativa';
      nameEl.className = 'presenter-name empty';
      labelEl.textContent = '—';
    } else if (s.current) {
      nameEl.textContent = s.current;
      nameEl.className = 'presenter-name';
      labelEl.textContent = `${s.progress}º de ${s.total}`;
    }

    // Progress
    const pct = s.total > 0 ? (s.progress / s.total) * 100 : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = `${s.progress} / ${s.total} participantes`;

    // Buttons
    const active = s.dailyActive && !!s.current;
    document.getElementById('btnStart').textContent = s.dailyActive ? '↺ Reiniciar' : '▶ Iniciar Daily';
    document.getElementById('btnNext').disabled = !active;
    document.getElementById('btnSkip').disabled = !active;

    // Queue
    const list = document.getElementById('queueList');
    if (s.currentOrder.length === 0) {
      list.innerHTML = '<li class="empty-state">Nenhum participante</li>';
    } else {
      list.innerHTML = s.currentOrder.map((name, i) => {
        const isDone = i < s.currentIndex;
        const isCurrent = s.dailyActive && i === s.currentIndex;
        const isSkipped = s.skips.some(sk => sk.name === name && i > s.currentIndex);
        let cls = isDone ? 'done' : isCurrent ? 'current' : '';
        let badgeCls = isDone ? 'badge-done' : isCurrent ? 'badge-current' : isSkipped ? 'badge-skipped' : 'badge-next';
        let badgeContent = isDone ? '✓' : isCurrent ? '🎤' : isSkipped ? '⏭' : (i + 1);
        return `<li class="queue-item ${cls}">
          <div class="queue-badge ${badgeCls}">${badgeContent}</div>
          <span class="queue-name">${name}</span>
          ${isSkipped ? '<span class="skip-tag">pulado</span>' : ''}
        </li>`;
      }).join('');
    }

    // Participants
    const pList = document.getElementById('participantsList');
    if (s.participants.length === 0) {
      pList.innerHTML = '<div class="empty-state">Nenhum participante cadastrado</div>';
    } else {
      pList.innerHTML = s.participants.map(p => `
        <div class="participant-item">
          <span>👤 ${p}</span>
          <button class="del-btn" onclick="removeParticipant('${encodeURIComponent(p)}')" title="Remover">✕</button>
        </div>
      `).join('');
    }

    // Skips log
    const skipsCard = document.getElementById('skipsCard');
    const skipLog = document.getElementById('skipLog');
    if (s.skips && s.skips.length > 0) {
      skipsCard.style.display = '';
      skipLog.innerHTML = s.skips.map(sk => {
        const t = new Date(sk.time).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        return `<div class="skip-entry"><strong>${sk.name}</strong> — ${sk.justification} <span style="color:var(--muted);font-size:0.75rem">(${t})</span></div>`;
      }).join('');
    } else {
      skipsCard.style.display = 'none';
    }
  }

  async function addParticipant() {
    const input = document.getElementById('newName');
    const name = input.value.trim();
    if (!name) return;
    const res = await api('POST', '/api/participants', { name });
    if (res.error) return toast('❌ ' + res.error, true);
    input.value = '';
    toast('✅ ' + name + ' adicionado(a)');
    loadState();
  }

  async function removeParticipant(name) {
    if (!confirm(`Remover ${decodeURIComponent(name)}?`)) return;
    const res = await api('DELETE', '/api/participants/' + name);
    if (res.error) return toast('❌ ' + res.error, true);
    toast('🗑 Participante removido');
    loadState();
  }

  async function startDaily() {
    const res = await api('POST', '/api/start');
    if (res.error) return toast('❌ ' + res.error, true);
    toast('🚀 Daily iniciada! Card enviado ao Teams.');
    loadState();
  }

  async function nextParticipant() {
    const res = await api('POST', '/api/next');
    if (res.error) return toast('❌ ' + res.error, true);
    if (res.done) toast('🎉 Daily concluída!');
    else toast('✅ Próximo: ' + res.presenter);
    loadState();
  }

  function openSkipModal() {
    const current = currentState?.current;
    if (!current) return;
    document.getElementById('skipCurrentName').textContent = current;
    document.getElementById('skipJustification').value = '';
    document.getElementById('skipOverlay').classList.add('show');
    setTimeout(() => document.getElementById('skipJustification').focus(), 100);
  }

  function closeSkipModal() {
    document.getElementById('skipOverlay').classList.remove('show');
  }

  async function confirmSkip() {
    const j = document.getElementById('skipJustification').value.trim();
    if (!j) {
      document.getElementById('skipJustification').style.borderColor = 'var(--red)';
      return;
    }
    document.getElementById('skipJustification').style.borderColor = '';
    closeSkipModal();
    const res = await api('POST', '/api/skip', { justification: j });
    if (res.error) return toast('❌ ' + res.error, true);
    toast(`⏭ ${res.skipped} pulado(a). Vez de ${res.next}.`);
    loadState();
  }

  async function resetDaily() {
    if (!confirm('Resetar a ordem da daily para alfabética?')) return;
    await api('POST', '/api/reset');
    toast('↺ Ordem resetada');
    loadState();
  }

  let toastTimer;
  function toast(msg, err = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.borderColor = err ? 'var(--red)' : 'var(--border)';
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
  }

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'n' || e.key === 'N') nextParticipant();
    if (e.key === 's' || e.key === 'S') openSkipModal();
    if (e.key === 'Escape') closeSkipModal();
  });

  // Auto-refresh every 15s
  loadState();
  setInterval(loadState, 15000);
</script>
</body>
</html>
